<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Monterey Bay Events">
  <!-- Brand mark: a calendar with one marked day.
       Colors are the site's own tokens from src/styles/global.css,
       converted from oklch to sRGB:
         brass      oklch(0.78 0.13 85)  -> #ddb049
         background oklch(0.16 0.008 60) -> #100c0a
       Brass field (not dark) so the mark holds contrast against both
       light and dark browser tab bars at 16px. -->
  <rect width="64" height="64" rx="13" fill="#ddb049"/>
  <rect x="20" y="9" width="6" height="10" rx="3" fill="#100c0a"/>
  <rect x="38" y="9" width="6" height="10" rx="3" fill="#100c0a"/>
  <rect x="11" y="15" width="42" height="40" rx="6" fill="#100c0a"/>
  <rect x="17" y="26" width="30" height="2.5" rx="1.25" fill="#ddb049" opacity="0.55"/>
  <rect x="18" y="34" width="12" height="12" rx="2.5" fill="#ddb049"/>
</svg>
